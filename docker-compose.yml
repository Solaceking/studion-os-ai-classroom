services:
  studion-classroom:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Optional: mount server-providers.yml for provider config
      # - ./server-providers.yml:/app/server-providers.yml:ro
      - studion-classroom-data:/app/data
    restart: unless-stopped

volumes:
  studion-classroom-data:


